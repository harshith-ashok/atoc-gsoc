[project]
name = "atoc"
version = "0.2.0"
description = "Fight back using code duplication detection from security patches."
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
atoc = "atoc.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["atoc"]
